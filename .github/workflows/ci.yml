name: Source and synthetic-data checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check tracked source files
        run: python3 scripts/check_release.py --staged
      - name: Install distribution GDAL bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gdal gdal-bin
      - name: Check syntax
        run: |
          bash -n start.sh start.command
          node --check static/app.js
      - name: Test with synthetic data only
        env:
          GDB_INSPECTOR_RUNTIME_DIR: ${{ runner.temp }}/filegdb-inspector-runtime
        run: /usr/bin/python3 -B -m unittest discover -s . -p 'test_*.py' -v
      - name: Validate source archive
        run: /usr/bin/python3 scripts/build_release.py --output-dir "${RUNNER_TEMP}/filegdb-release"
